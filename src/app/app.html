<div class="app-shell d-flex flex-column">
  <app-header />

  <div class="app-body d-flex flex-grow-1 position-relative overflow-hidden" cdkDropListGroup>
    <div
      class="app-backdrop d-md-none"
      [class.show]="store.paletteOpen() || store.explorerOpen()"
      aria-hidden="true"
      (click)="store.closeSidebars()"
    ></div>

    <app-palette-sidebar />
    <app-canvas-stage />
    <app-explorer-sidebar />
  </div>
</div>

<app-edit-label-dialog />
<app-clear-dialog />
<app-new-view-dialog />
