<div class="flex flex-col h-full w-full overflow-hidden">
  <app-header />

  <div class="flex flex-1 overflow-hidden relative">
    <div
      class="fixed inset-0 bg-black/50 z-40 md:hidden"
      [class.hidden]="!store.paletteOpen() && !store.explorerOpen()"
      aria-hidden="true"
      (click)="store.closeSidebars()"
    ></div>

    <app-palette-sidebar />
    <app-canvas-stage />
    <app-explorer-sidebar />
  </div>
</div>

<app-edit-label-dialog />
<app-clear-dialog />
<app-new-view-dialog />
